# PeakCore - Einstellungen

# Hinweis im Chat fuer Spieler, deren Mod sich nicht gemeldet hat. Sie werden nie gekickt.
non-mod-hint:
  enabled: true
  delay-ticks: 100   # 20 Ticks = 1 Sekunde; so lange wartet der Server auf die Mod, bevor er den Hinweis zeigt

# Server-Resource-Pack (gebaut mit /peakcore pack rebuild). Das Format steht in der version.json des Servers
# (Minecraft 26.2: resource_major 88, resource_minor 0) und aendert sich mit jeder Minecraft-Version.
pack:
  description: "PeakVerse"
  format-major: 88
  format-minor: 0

  # Basis-Pack: ein fertiges Resource-Pack (ZIP) als Grundlage, Pfad relativ zu plugins/PeakCore. Die Beitraege der Module werden dazugemischt.
  # Bei Konflikten gewinnt das Basis-Pack. Nur Dateien unter assets/ mit kleingeschriebenen Pfaden werden uebernommen. Leer = kein Basis-Pack.
  base-file: ""

  # Welche Variante Spieler ohne eigene Einstellung bekommen: "standard" oder "lite" (ohne die als optional gemeldeten Zusatzdateien der Module,
  # also kleiner). Pro Spieler aenderbar mit /peakcore pack variant <spieler> <variante>.
  default-variant: standard
  # PNG-Dateien verlustfrei verkleinern (gleiche Pixel, staerkere Kompression, ohne Text-Bloecke). Nach einem Java-Update kann sich dadurch der Pack-Hash aendern.
  optimize-png: true

  # Eingebauter Webserver, von dem die Spieler das Pack laden. Aus, bis du ihn einschaltest (er oeffnet einen Port).
  # Der Port muss in der Firewall/beim Anbieter freigegeben sein (TCP), sonst kommt das Pack nicht an.
  web:
    enabled: false
    port: 8123
    bind: "0.0.0.0"
  # Adresse, unter der Spieler den Webserver erreichen, z. B. "http://play.example.com:8123". Ohne sie wird nichts gesendet.
  public-url: ""
  # Ausweg: liegt das Pack woanders (Webspace, CDN), hier die volle Adresse mit {sha1}, z. B. "https://example.com/packs/{sha1}.zip".
  # Hat Vorrang vor public-url; dann ist der eingebaute Webserver nicht noetig.
  external-url: ""
  send:
    enabled: false        # Pack beim Beitritt (und nach Aenderungen) an die Spieler schicken
    # true: Spieler mit der PeakVerse-Mod laden das Pack selbst (ohne Annahme-Dialog), bekommen alle 2 Minuten eine Chat-Erinnerung und
    # nutzen es ab dem naechsten Beitritt. Spieler ohne Mod bekommen weiter den normalen Dialog. false: alle bekommen den Dialog.
    via-mod: true
    required: false       # true: wer ablehnt, wird vom Server getrennt (gilt nur fuer den Dialog)
    prompt: ""            # Text im Annahme-Dialog; leer = keiner

# Web-Oberflaeche fuer Administratoren (Texturen, Pack, Protokoll). Aus, bis du sie einschaltest. Sie laeuft auf demselben Port wie der
# Pack-Webserver (pack.web.port) und startet diesen mit. Zugang nur mit einem Einmal-Link aus dem Spiel: /peakcore web (nur Operatoren).
# Der Link ist 5 Minuten gueltig und nur einmal einloesbar; die Sitzung dauert 8 Stunden.
web:
  enabled: false
  # Adresse, unter der du die Oberflaeche im Browser erreichst, z. B. "https://play.example.com:8123". Leer = http://localhost:<port>
  # (Der Link aus /peakcore web nutzt diese Adresse.) Ohne HTTPS laufen Passwoerter nicht, aber der Einmal-Link und das Cookie sind im Klartext
  # sichtbar: fuer das Internet besser hinter einem HTTPS-Proxy betreiben.
  public-url: ""
  # Wie lange eine Anmeldung gilt (Stunden).
  session-hours: 8
  # Eine Sitzung gilt nur von der IP, mit der man sich angemeldet hat. Hinter einem Proxy (alle Anfragen kommen von dessen IP) auf false stellen.
  bind-session-ip: true
  # Geraete (z. B. das Handy) koppeln: Auf der Anmeldeseite gibt man seinen Minecraft-Namen ein, im Spiel kommt eine Nachricht mit Code zum Erlauben,
  # danach bleibt das Geraet angemeldet (ohne neuen Link). Nur fuer Operatoren und Rollen mit Web-Zugang. Mit false ist das Koppeln aus.
  # Wichtig: Ueber http:// (ohne Verschluesselung) kann der Schluessel im oeffentlichen WLAN mitgelesen werden. Besser hinter https (Proxy) betreiben.
  remote-login: true
  # Ein gekoppeltes Geraet verfaellt nach so vielen Tagen ohne Benutzung. 0 = nie (nur Sperren per Web, /peakweb revoke <id> oder wenn der Spieler kein Operator mehr ist).
  device-expire-days: 0
  # Web-Tunnel: Die Mod oeffnet die Web-Oberflaeche im Browser ueber die Minecraft-Verbindung (Taste oder /peakcoreweb), ohne dass der Web-Port
  # von aussen erreichbar sein muss. Der Server verbindet sich dafuer selbst mit seinem Web-Port (pack.web.port). Nur Spieler mit Web-Zugang.
  tunnel: true

# Eingebaute Module. Ein ausgeschaltetes Modul wird nicht gestartet (nach Aenderung den Server neu starten).
# Seine Daten bleiben unberuehrt liegen.
# Rechte-Verwaltung: Plugins, deren Rechte zusaetzlich in Rollen und je Spieler gesetzt werden koennen (Reiter Spieler > Plugins)
permissions:
  manage-plugins: []

modules:
  peaksound:
    enabled: true
  texturepeak:
    enabled: true
  peakboard:
    enabled: true
  peakachievements:
    enabled: true
  peakenchants:
    enabled: true
  peakadmin:
    enabled: true
  peakwarps:
    enabled: true

# Updates: PeakCore prueft ein oeffentliches GitHub-Release-Repo, laedt neue Versionen nach plugins/update/ (Paper installiert sie beim naechsten Start)
# und kann den Server mit Countdown neu starten. Ein Reload ohne Neustart gibt es bewusst nicht.
# Das Release braucht PeakCore-<Version>.jar und PeakCore-<Version>.jar.sha256 (SHA-256-Pruefsumme); ohne Pruefsumme wird nichts installiert.
update:
  enabled: false
  repo: "Snippe187/PeakVerse-Releases"
  api-url: "https://api.github.com"
  check-hours: 12
  restart-minutes: 5
  # restart = der Server startet sich neu (braucht ein Start-Skript mit Neustart, spigot.yml: restart-script), stop = der Server wird nur beendet
  restart-mode: restart
