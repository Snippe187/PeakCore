# PeakCore - Einstellungen

# Hinweis im Chat fuer Spieler, deren Mod sich nicht gemeldet hat. Sie werden nie gekickt.
non-mod-hint:
  enabled: true
  delay-ticks: 100   # 20 Ticks = 1 Sekunde; so lange wartet der Server auf die Mod, bevor er den Hinweis zeigt

# Server-Resource-Pack (gebaut mit /peakcore pack rebuild). Das Format steht in der version.json des Servers
# (Minecraft 26.2: resource_major 88, resource_minor 0) und aendert sich mit jeder Minecraft-Version.
pack:
  description: "PeakVerse"
  format-major: 88
  format-minor: 0

  # Basis-Pack: ein fertiges Resource-Pack (ZIP) als Grundlage, Pfad relativ zu plugins/PeakCore. Die Beitraege der Module werden dazugemischt.
  # Bei Konflikten gewinnt das Basis-Pack. Nur Dateien unter assets/ mit kleingeschriebenen Pfaden werden uebernommen. Leer = kein Basis-Pack.
  base-file: ""

  # Welche Variante Spieler ohne eigene Einstellung bekommen: "standard" oder "lite" (ohne die als optional gemeldeten Zusatzdateien der Module,
  # also kleiner). Pro Spieler aenderbar mit /peakcore pack variant <spieler> <variante>.
  default-variant: standard
  # PNG-Dateien verlustfrei verkleinern (gleiche Pixel, staerkere Kompression, ohne Text-Bloecke). Nach einem Java-Update kann sich dadurch der Pack-Hash aendern.
  optimize-png: true

  # Eingebauter Webserver, von dem die Spieler das Pack laden. Aus, bis du ihn einschaltest (er oeffnet einen Port).
  # Der Port muss in der Firewall/beim Anbieter freigegeben sein (TCP), sonst kommt das Pack nicht an.
  web:
    enabled: false
    port: 8123
    bind: "0.0.0.0"
  # Adresse, unter der Spieler den Webserver erreichen, z. B. "http://play.example.com:8123". Ohne sie wird nichts gesendet.
  public-url: ""
  # Ausweg: liegt das Pack woanders (Webspace, CDN), hier die volle Adresse mit {sha1}, z. B. "https://example.com/packs/{sha1}.zip".
  # Hat Vorrang vor public-url; dann ist der eingebaute Webserver nicht noetig.
  external-url: ""
  send:
    enabled: false        # Pack beim Beitritt (und nach Aenderungen) an die Spieler schicken
    required: false       # true: wer ablehnt, wird vom Server getrennt
    prompt: ""            # Text im Annahme-Dialog; leer = keiner

# Eingebaute Module. Ein ausgeschaltetes Modul wird nicht gestartet (nach Aenderung den Server neu starten).
# Seine Daten bleiben unberuehrt liegen.
modules:
  peaksound:
    enabled: true
