<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakVerse</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo"></span><b>PeakVerse</b></div>
    <nav id="nav"></nav>
    <div class="tools">
      <span id="who" class="who"></span>
      <button id="b-lang" class="px-btn small" title="Sprache / Language">DE</button>
      <button id="b-theme" class="px-btn small" title="Tag / Nacht"></button>
      <button id="b-fx" class="px-btn small" title="Effekte">FX</button>
      <button id="b-snd" class="px-btn small" title="Sounds">&#9835;</button>
      <button id="b-out" class="px-btn small ghost"></button>
    </div>
  </header>
  <main id="main"><div id="crumb"></div><div id="view"></div></main>
  <footer id="foot"><span class="logo"></span> PeakVerse &middot; <span id="ver"></span></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
